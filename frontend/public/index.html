    <!-- Google Analytics 4 -->
    <script>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Strip any "Built with Emergent" / "Made with Emergent" badge injected at runtime -->
    <script>
      (function () {
        var PATTERN = /(built|made|created|powered)\s+(with|by)\s+emergent/i;
        function scrub() {
          try {
            // 1) Elements with matching text content (usually <a> or small <div>/<span>)
            var candidates = document.querySelectorAll('a, div, span, aside, footer, section');
            for (var i = 0; i < candidates.length; i++) {
              var el = candidates[i];
              if (el.id === 'root' || el.contains(document.getElementById('root'))) continue;
              var txt = (el.innerText || el.textContent || '').trim();
              if (txt && PATTERN.test(txt) && txt.length < 80) {
                el.remove();
              }
            }
            // 2) Any anchor pointing to emergent.sh / emergent.dev / app.emergent
            var anchors = document.querySelectorAll('a[href*="emergent.sh"], a[href*="emergent.dev"], a[href*="app.emergent"]');
            for (var j = 0; j < anchors.length; j++) {
              var a = anchors[j];
              if (a.id === 'root' || a.contains(document.getElementById('root'))) continue;
              a.remove();
            }
          } catch (e) { /* noop */ }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', scrub);
        } else {
          scrub();
        }
        // Watch for late-injected badges
        try {
          var mo = new MutationObserver(function () { scrub(); });
          mo.observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) { /* noop */ }
      })();
    </script>
